<script>
  let phoneCoords = null;
  let phoneHeading = 0;
  let targetCoords = null;

  // Listen for coordinates cross-tab from the primary Ground Station page
  const telemetryChannel = new BroadcastChannel("followme_telemetry");

  window.addEventListener("DOMContentLoaded", () => {
    // 1. Try loading last known target location immediately from localStorage
    loadCachedTarget();

    // 2. Initialize phone sensors
    initPhoneTracking();

    // 3. User interaction requirement for iOS / Android Compass Permissions
    document.body.addEventListener("click", requestCompassPermission, { once: true });
  });

  function loadCachedTarget() {
    const cached = localStorage.getItem("last_rocket_telemetry");
    if (cached) {
      try {
        const data = JSON.parse(cached);
        processTelemetryData(data);
      } catch (e) {
        console.error("Error reading cached telemetry:", e);
      }
    }
  }

  // --- CROSS-PAGE DATA RECEIVER ---
  telemetryChannel.onmessage = (event) => {
    if (event.data) {
      processTelemetryData(event.data);
      // Cache latest position to survive page reloads/switches
      localStorage.setItem("last_rocket_telemetry", JSON.stringify(event.data));
    }
  };

  function processTelemetryData(data) {
    // Accommodate lat/lon or latitude/longitude key naming variations
    const lat = data.lat !== undefined ? data.lat : data.latitude;
    const lon = data.lon !== undefined ? data.lon : data.longitude;

    if (lat !== undefined && lon !== undefined && lat !== 0 && lon !== 0) {
      targetCoords = {
        lat: parseFloat(lat),
        lon: parseFloat(lon)
      };

      document.getElementById("tgtLat").innerText = targetCoords.lat.toFixed(6);
      document.getElementById("tgtLon").innerText = targetCoords.lon.toFixed(6);
      document.getElementById("lora-status").innerText = "● Tracking Target";
      document.getElementById("lora-status").style.color = "var(--success)";

      updateNavigationCalculation();
    }
  }

  // --- PHONE GEOLOCATION & COMPASS MATRIX ---
  function initPhoneTracking() {
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          phoneCoords = {
            lat: position.coords.latitude,
            lon: position.coords.longitude
          };
          document.getElementById("gpsStatus").innerText = "Phone GPS Active. Point towards target.";
          updateNavigationCalculation();
        },
        (err) => {
          console.error("Phone GPS Denied/Error: ", err);
          document.getElementById("gpsStatus").innerText = "GPS Error: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    } else {
      document.getElementById("gpsStatus").innerText = "Geolocation not supported by this browser.";
    }
  }

  function requestCompassPermission() {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission()
        .then((response) => {
          if (response === "granted") {
            window.addEventListener("deviceorientation", handleCompassMove, true);
          }
        })
        .catch(console.error);
    } else {
      if ("ondeviceorientationabsolute" in window) {
        window.addEventListener("deviceorientationabsolute", handleCompassMove, true);
      } else {
        window.addEventListener("deviceorientation", handleCompassMove, true);
      }
    }
  }

  function handleCompassMove(event) {
    let heading = null;

    if (event.webkitCompassHeading) {
      // iOS Direction
      heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
      // Android / Standard Direction
      heading = event.absolute ? event.alpha : 360 - event.alpha;
    }

    if (heading !== null) {
      phoneHeading = heading;
      updateNavigationCalculation();
    }
  }

  // --- MATHEMATICAL DIRECTION TRANSFORM ---
  function updateNavigationCalculation() {
    if (!phoneCoords || !targetCoords) return;

    const lat1 = (phoneCoords.lat * Math.PI) / 180;
    const lon1 = (phoneCoords.lon * Math.PI) / 180;
    const lat2 = (targetCoords.lat * Math.PI) / 180;
    const lon2 = (targetCoords.lon * Math.PI) / 180;

    // 1. Absolute Bearing Vector
    const dLon = lon2 - lon1;
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    let bearing = (Math.atan2(y, x) * 180) / Math.PI;
    bearing = (bearing + 360) % 360;

    // 2. Distance Vector (Haversine Formula)
    const R = 6371000; // meters
    const dLat = lat2 - lat1;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    const distanceMeters = R * c;

    // Display formatted outputs
    document.getElementById("targetDist").innerText =
      distanceMeters > 1000 ? (distanceMeters / 1000).toFixed(2) + " km" : distanceMeters.toFixed(1) + " m";
    document.getElementById("targetBearing").innerText = Math.round(bearing) + "°";

    // 3. Compass Arrow Rotation Calculation
    const arrowRotation = (bearing - phoneHeading + 360) % 360;
    document.getElementById("directionArrow").style.transform = `rotate(${arrowRotation}deg)`;
  }
</script>

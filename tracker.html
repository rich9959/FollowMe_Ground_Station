<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FollowMe Live Navigation Tracker</title>
    <style>
      :root {
        --primary: #007bff;
        --success: #28a745;
        --danger: #dc3545;
        --dark: #333;
        --light: #f8f9fa;
      }
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: #e9ecef;
        margin: 0;
        padding: 15px;
      }
      .card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .big-data {
        font-size: 2.2rem;
        font-weight: bold;
        color: var(--primary);
        display: block;
      }
      .label {
        font-size: 0.8rem;
        color: #666;
        text-transform: uppercase;
        margin-top: 5px;
        display: block;
      }
      .btn-back {
        background: var(--dark);
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        margin-bottom: 15px;
      }

      /* Navigation UI Elements */
      .tracker-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px;
      }
      .compass-ring {
        width: 180px;
        height: 180px;
        border: 4px dashed #ccc;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
      }
      .compass-arrow {
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 55px solid var(--danger);
        position: absolute;
        transform: rotate(0deg);
        transform-origin: center center;
        transition: transform 0.1s ease-out;
      }
      .tracker-stats {
        width: 100%;
        text-align: center;
        font-size: 1rem;
        color: #444;
      }
      .status-dot {
        font-size: 0.85rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Return to main control center -->
    <a href="index.html" class="btn-back">← Back to Command Center</a>

    <div class="card">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <strong style="font-size: 1.2rem">Direction Pointer</strong>
        <span id="lora-status" class="status-dot" style="color: var(--danger)"
          >● No LoRa Data</span
        >
      </div>

      <div class="tracker-container">
        <div class="compass-ring">
          <div id="directionArrow" class="compass-arrow"></div>
        </div>

        <div class="tracker-stats">
          <div class="grid-2">
            <div class="card" style="background: #f8f9fa; margin: 0">
              <span class="label">Distance to Target</span>
              <span
                id="targetDist"
                style="font-size: 1.5rem; font-weight: bold; color: var(--dark)"
                >---</span
              >
            </div>
            <div class="card" style="background: #f8f9fa; margin: 0">
              <span class="label">Target Bearing</span>
              <span
                id="targetBearing"
                style="font-size: 1.5rem; font-weight: bold; color: var(--dark)"
                >---</span
              >
            </div>
          </div>
          <small
            id="gpsStatus"
            style="color: #888; display: block; margin-top: 15px"
            >Initializing Phone Sensors...</small
          >
        </div>
      </div>
    </div>

    <div class="card">
      <span class="label">Current Target Coordinates</span>
      <div class="grid-2" style="margin-top: 5px">
        <div>Latitude: <strong id="tgtLat">---</strong></div>
        <div>Longitude: <strong id="tgtLon">---</strong></div>
      </div>
    </div>

    <script>
      let phoneCoords = null;
      let phoneHeading = 0;
      let targetCoords = null;

      // Listen for coordinates cross-tab from the primary Ground Station page
      const telemetryChannel = new BroadcastChannel("followme_telemetry");

      window.addEventListener("DOMContentLoaded", () => {
        initPhoneTracking();

        // Auto-request compass permissions explicitly for iOS visitors
        document.body.addEventListener(
          "click",
          () => {
            if (
              typeof DeviceOrientationEvent.requestPermission === "function"
            ) {
              DeviceOrientationEvent.requestPermission().catch(console.error);
            }
          },
          { once: true },
        );
      });

      // --- CROSS-PAGE DATA RECEIVER ---
      telemetryChannel.onmessage = (event) => {
        if (event.data && event.data.lat && event.data.lon) {
          targetCoords = {
            lat: event.data.lat,
            lon: event.data.lon,
          };

          document.getElementById("tgtLat").innerText =
            targetCoords.lat.toFixed(6);
          document.getElementById("tgtLon").innerText =
            targetCoords.lon.toFixed(6);
          document.getElementById("lora-status").innerText =
            "● Tracking Target";
          document.getElementById("lora-status").style.color = "var(--success)";

          updateNavigationCalculation();
        }
      };

      // --- PHONE GEOLOCATION & COMPASS MATRIX ---
      function initPhoneTracking() {
        if ("geolocation" in navigator) {
          navigator.geolocation.watchPosition(
            (position) => {
              phoneCoords = {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
              };
              document.getElementById("gpsStatus").innerText =
                "Phone GPS Active. Awaiting direction data...";
              updateNavigationCalculation();
            },
            (err) => {
              console.error("Phone GPS Denied/Error: ", err);
            },
            { enableHighAccuracy: true },
          );
        }

        if (window.DeviceOrientationEvent) {
          if ("ondeviceorientationabsolute" in window) {
            window.addEventListener(
              "deviceorientationabsolute",
              handleCompassMove,
            );
          } else {
            window.addEventListener("deviceorientation", handleCompassMove);
          }
        }
      }

      function handleCompassMove(event) {
        let heading = event.alpha;
        if (event.webkitCompassHeading) {
          heading = event.webkitCompassHeading; // iOS compatibility
        } else if (event.absolute === false && event.alpha !== null) {
          heading = 360 - event.alpha; // Android fallback
        }

        if (heading !== null && heading !== undefined) {
          phoneHeading = heading;
          updateNavigationCalculation();
        }
      }

      // --- MATHEMATICAL DIRECTION TRANSFORM ---
      function updateNavigationCalculation() {
        if (!phoneCoords || !targetCoords) return;

        const lat1 = (phoneCoords.lat * Math.PI) / 180;
        const lon1 = (phoneCoords.lon * Math.PI) / 180;
        const lat2 = (targetCoords.lat * Math.PI) / 180;
        const lon2 = (targetCoords.lon * Math.PI) / 180;

        // 1. Calculate Absolute Bearing Vector
        const dLon = lon2 - lon1;
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x =
          Math.cos(lat1) * Math.sin(lat2) -
          Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
        let bearing = (Math.atan2(y, x) * 180) / Math.PI;
        bearing = (bearing + 360) % 360;

        // 2. Calculate Distance Vector (Haversine Formula)
        const R = 6371000;
        const dLat = lat2 - lat1;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1) *
            Math.cos(lat2) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        const distanceMeters = R * c;

        // Humanize unit string scale
        let displayDistance =
          distanceMeters > 1000
            ? (distanceMeters / 1000).toFixed(2) + " km"
            : distanceMeters.toFixed(1) + " m";

        document.getElementById("targetDist").innerText = displayDistance;
        document.getElementById("targetBearing").innerText =
          Math.round(bearing) + "°";

        // 3. Compensate arrow angle relative to current phone twist orientation
        const arrowRotation = bearing - phoneHeading;
        document.getElementById("directionArrow").style.transform =
          `rotate(${arrowRotation}deg)`;
        document.getElementById("gpsStatus").innerText =
          "Azi/Dist calculation updated live.";
      }
    </script>
  </body>
</html>
